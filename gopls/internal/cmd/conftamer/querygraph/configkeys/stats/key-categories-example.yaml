# A small subset of Prometheus' config: one full key per category. Classifications are from the 2026-11-08
# concreteconfig skill run (gopls/results/prom/concreteconfig-2026-11-08/config.yaml), scored with today's
# --ignore (paramtrack/ignore/prometheus.txt) and --transformed (paramtrack/transformed/prometheus.txt).
# `{}`: a key the skill's config doesn't set.
alerting:
  alertmanagers:
    - api_version: v2                                   # string literal: "v2" is also a string literal in Prometheus' code
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]  # duplicate value (1 of 2), see below
scrape_configs:
  - job_name: ccfg-scrape-configs-job-name              # unambiguous (1 of 2; same section as metrics_path)
    metrics_path: /ccfg-scrape-configs-metrics-path     # unambiguous (2 of 2): no other key has its value, and it's not a code literal
    honor_labels: {}                                    # unsearchable kind: a bool (argmatch searches only strings)
    proxy_url: http://proxy.example:3128                # transformed: parsed into a config.URL
    basic_auth:
      password_ref: {}                                  # not set by the skill: *_ref keys fail at runtime (no secret manager)
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]    # duplicate value (2 of 2): same value at two keys
    azure_sd_configs:
      - subscription_id: {}                             # not in scope: --ignore leaves out scrape_configs.azure_sd_configs.*

