global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace']
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 2d
  receiver: amgithubnotifier-bridge
  routes:
  # Notify on the frequently-firing latency alert several times a minute, per test Prometheus.
  - matchers:
    - alertname="benchmarkQueryLatencyAboveAverage"
    group_by: ['alertname', 'namespace', 'prometheus']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 10s

receivers:
- name: amgithubnotifier-bridge
  webhook_configs:
  - send_resolved: false
    url: 'http://amgithubnotifier/hook'
